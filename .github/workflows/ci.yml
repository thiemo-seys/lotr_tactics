name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # For the server's tests against Postgres (docs/accounts-spec.md section 16).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lotr
          POSTGRES_PASSWORD: lotr
          POSTGRES_DB: lotr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username lotr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DATABASE_URL: postgres://lotr:lotr@localhost:5432/lotr_test
      - run: pnpm build
      - run: docker build -t lotr-tactics .
      - name: Smoke-test the image
        # With a Postgres of its own beside it on a Docker network, as compose.yaml runs it.
        run: |
          docker network create lotr
          docker run -d --name lotr-db --network lotr -e POSTGRES_USER=lotr -e POSTGRES_PASSWORD=lotr -e POSTGRES_DB=lotr postgres:17
          for i in $(seq 30); do docker exec lotr-db pg_isready --username lotr --dbname lotr && break; sleep 1; done
          docker run -d --name lotr --network lotr -p 8080:8080 -e DATABASE_URL=postgres://lotr:lotr@lotr-db:5432/lotr lotr-tactics
          for i in $(seq 30); do
            if curl -fsS http://localhost:8080/play.html > /dev/null && curl -fsS http://localhost:8080/api/me | grep -q '"id"'; then exit 0; fi
            sleep 1
          done
          docker logs lotr
          exit 1
