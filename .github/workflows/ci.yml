name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker build -t lotr-tactics .
      - name: Smoke-test the image
        run: |
          docker run -d --name lotr -p 8080:8080 lotr-tactics
          for i in $(seq 30); do curl -fsS http://localhost:8080/play.html > /dev/null && exit 0; sleep 1; done
          docker logs lotr
          exit 1
