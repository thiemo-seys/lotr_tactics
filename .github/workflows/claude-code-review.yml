name: Claude Code Review

# Reviews each pull request with the official code-review plugin and posts
# findings as inline comments. The plugin also checks the diff against the
# rules in CLAUDE.md.
#
# Setup:
# - Install the Claude GitHub App on this repo: https://github.com/apps/claude
# - Add a repo secret CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token`).
#   To bill a Claude API key instead, add ANTHROPIC_API_KEY and swap the auth
#   line below for: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Puts Claude's report in the job summary, so a run that posts
          # nothing still says why. Only collaborators can open pull requests
          # here, so the input is trusted.
          display_report: true
          # The plugin's review agents read the pull request and post the
          # summary with gh; without these they are refused and the review
          # stops before it starts. The action only starts the inline-comment
          # MCP server when it is named here, so keep it in the list.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"'
