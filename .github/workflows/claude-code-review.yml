name: Claude Code Review

# Reviews a pull request when it is opened, and again whenever a collaborator
# comments "@claude review" on it. Findings go in inline comments, with one
# summary comment per review. What to check is in the "When reviewing" section
# of CLAUDE.md, which the action always reads from main, so a pull request
# can't change its own review.
#
# Setup:
# - Install the Claude GitHub App on this repo: https://github.com/apps/claude
# - Add a repo secret CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token`).
#   To bill a Claude API key instead, add ANTHROPIC_API_KEY and swap the auth
#   line below for: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    # A pull request that only changes the lockfile isn't worth a review.
    paths-ignore:
      - pnpm-lock.yaml
  issue_comment:
    types: [created]

jobs:
  review:
    # Comment-started reviews: only for "@claude review" on a pull request, by
    # someone with access. The action checks write access again itself.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review') &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    # On the job, not the workflow, so that the review's own summary comment,
    # which starts a run that skips this job, doesn't cancel the review.
    concurrency:
      group: claude-code-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      # The pull request's own head, with history for git log and blame. The
      # review only reads it; nothing from the pull request is run.
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 0

      - id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Subagents run in the background by default, and a headless run
          # ends with Claude's turn, which stops them before they report. This
          # keeps them in the foreground.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Puts Claude's report in the job summary, so a run that posts
          # nothing still says why. Only collaborators can open pull requests
          # here, so the input is trusted. Full output stays off: the
          # repository is public.
          display_report: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this pull request to LOTR Tactics. Its head is checked out in the working directory. CLAUDE.md lists the project's conventions, and its "When reviewing" section says what to check and what isn't worth a comment. The docs it names (docs/design.md and the specs) are the source of truth for the rules.

            Read files with the Read, Grep and Glob tools. Bash is only for the gh and git commands named here, run from the working directory: commands with `cd` or that write output to a file are refused.

            1. Read the pull request with `gh pr view` and `gh pr diff`, and the comments already on it with `gh pr view --comments`. This may be a re-review: don't repeat a finding that is already there unless the latest commits still have the problem.
            2. Launch four general-purpose subagents (not Explore agents) in one message, one for each area of "When reviewing": determinism, rules against the docs, bugs, and tests. Give each the pull request's title and description, and ask for findings with the file, the line and what goes wrong. Each can run `gh pr diff <PR NUMBER>` itself, and use git log, show, diff and blame; pass on the rule above about reading files. Wait for all four reports before going on.
            3. Check every finding yourself against the code before keeping it. Keep only problems you have confirmed, in code this pull request changes.
            4. Post each finding as an inline comment with mcp__github_inline_comment__create_inline_comment and confirmed: true, saying what goes wrong, why, and how to fix it. Add a suggestion block only when it fixes the problem completely.
            5. Write one summary to review-summary.md with the Write tool, headed "Claude review" and the head commit's short SHA: one line per finding, or "No issues found" and the areas checked. Post it with `gh pr comment <PR NUMBER> --body-file review-summary.md`. Don't pass the text with $(...), a heredoc or a pipe: those commands are refused. Post nothing else, and don't write "@claude" in any comment.
          # The model runs the review and its subagents. The turn cap stops a
          # runaway run. Write is for the summary file; nothing is pushed. The
          # action only starts the inline-comment MCP server when it is named
          # here.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*)"

      # The action's log only counts refused tool calls. This prints which
      # calls were refused and Claude's last message, so a review that posts
      # nothing can be diagnosed from the job log.
      - name: Show refused tool calls
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: jq '.[] | select(.type == "result") | {permission_denials, result}' "$EXECUTION_FILE"
