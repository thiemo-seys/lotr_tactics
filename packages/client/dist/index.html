<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LOTR Tactics fight viewer</title>
    <script type="module" crossorigin src="./assets/viewer-Dzg_gDXU.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/style-DL-HSA5b.js">
    <link rel="stylesheet" crossorigin href="./assets/style-CHGSnhbN.css">
  </head>
  <body>
    <header id="controls">
      <div class="group">
        <label>Team A <select id="board-a"></select></label>
        <label>Team B <select id="board-b"></select></label>
        <label>Seed <input id="seed" type="number" step="1" /></label>
        <label>Stage <input id="stage" type="number" min="1" step="1" /></label>
        <button id="new-fight">New fight</button>
      </div>
      <div class="group">
        <button id="play">Pause</button>
        <button id="step">Step</button>
        <button id="restart">Restart</button>
        <label
          >Speed
          <select id="speed">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
        </label>
        <span id="clock"></span>
        <button id="toggle-log">Log</button>
        <a href="./play.html">Play a game</a>
      </div>
    </header>
    <main>
      <div id="view"></div>
      <div id="banner" hidden></div>
      <aside id="log" hidden></aside>
    </main>
  </body>
</html>
